<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Exam Countdown</title>
<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}

.hero{text-align:center;border-width:2px}.hero .cd b{font-size:64px}.hero .cd span{font-size:22px}

nav button{border:0;background:none;font-size:12px;padding:4px 8px;color:var(--mut)}nav button.on{color:var(--ac);font-weight:700}

.modal>div{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}.modal input,.modal select{width:100%}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;gap:3px;grid-auto-columns:14px;overflow-x:auto}
.heat i{border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal div{min-height:58px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px;font-size:12px;overflow:hidden}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--mut)}.cal .t{border-color:var(--ac)}
.todo.d span{text-decoration:line-through;color:var(--mut)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.focus{position:fixed;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.focus .cd b{font-size:min(30vw,170px)}.focus .cd span{font-size:min(8vw,40px)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:left}
@media print{nav,.noprint,button{display:none!important}body{background:#fff;color:#000}}
</style></head><body><main id="m"></main><nav id="nv"></nav><canvas id="fx"></canvas><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),dk=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),uid=()=>Math.random().toString(36).slice(2,9);
const PR=[["GATE CS","💻","GATE","02-07"],["GATE EC","📡","GATE","02-08"],["GATE EE","⚡","GATE","02-14"],["GATE ME","⚙️","GATE","02-15"],["GATE CE","🏗️","GATE","02-01"],["ESE/IES Prelims","🛠️","ESE","02-09"],["ESE/IES Mains","📝","ESE","06-21"],["JEE Main","🧪","JEE","01-24"],["JEE Advanced","🚀","JEE","05-18"],["NEET UG","🩺","NEET","05-03"],["UPSC CSE Prelims","🏛️","UPSC","05-24"],["SSC CGL","📋","SSC","09-09"],["CAT","📈","MBA","11-30"],["CLAT","⚖️","Other","12-07"],["NDA","🎖️","Other","04-13"],["IBPS PO","🏦","Bank","08-17"],["SBI PO","🏦","Bank","03-08"],["RRB NTPC","🚆","Other","06-15"],["CUET UG","🎓","Other","05-15"],["UGC NET","📚","Other","06-25"]];

const QT=["Small steps every day beat big bursts once a month.","Discipline is choosing what you want most over what you want now.","You don’t need more time, you need more focus.","Today’s effort is tomorrow’s rank.","Consistency turns average into excellent.","Done is better than perfect. Revise, then revise again.","The exam rewards the one who kept showing up."];
const TZ=[["","Device time zone"],["+05:30","India (IST, +05:30)"],["+00:00","UTC"],["-05:00","US Eastern (−05:00)"],["+01:00","Central Europe (+01:00)"],["+08:00","Singapore/China (+08:00)"],["+04:00","Gulf (+04:00)"]];
const K='examcd1',def=()=>({ex:[],log:[],td:[],why:'',pin:null,gd:2,gw:12,s:{th:'auto',ac:'#6366f1',h24:0,wk:1,v:'card',sl:0,tz:'',rest:[],pw:25,pb:5,arch:1},nf:{},seen:0});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'));S.s=Object.assign(def().s,S.s)}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='home',sel=null,q='',cat='all',srt='date',mo=new Date(),undo=null,pm={run:0,mode:'w',end:0,rem:S.s.pw*60,sub:''};
const tg=e=>new Date(e.date+(S.s.tz?':00'+S.s.tz:'')),L=e=>tg(e)-Date.now(),ex=id=>S.ex.find(x=>x.id==id),cur=()=>ex(sel)||S.ex[0];
const isArch=e=>S.s.arch&&L(e)<-864e5*2;
const fT=d=>d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:!S.s.h24}),fD=d=>d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'});
const nd=e=>Math.ceil(L(e)/864e5);
function wd(e){let n=0,d=new Date(),t=tg(e),r=S.s.rest;for(let i=0;i<3700&&d<t;i++,d=new Date(d.getTime()+864e5)){const w=d.getDay();if(w%6&&!r.includes(w))n++}return n}
function we(e){let n=0,d=new Date(),t=tg(e);for(let i=0;i<3700&&d<t;i++,d=new Date(d.getTime()+864e5)){if(d.getDay()%6==0)n++}return n}
const urg=d=>d<=7?'#ef4444':d<=30?'#f59e0b':'#10b981';
function cdH(e){const ms=L(e);if(ms<=0)return ms>-864e5?'<b>🎯</b> <span>Exam day!</span>':'<b>✅</b> <span>Completed</span>';let s=Math.floor(ms/1e3),d=Math.floor(s/86400);s%=86400;return`<b>${d}</b><small>${S.s.sl?'sleeps':'days'}</small><span>${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}</span>`}
function prog(e){const t=tg(e)-(e.start||Date.now());return Math.max(0,Math.min(1,(Date.now()-(e.start||Date.now()))/Math.max(t,1)))}
function ring(e,z){const r=z/2-6,c=2*Math.PI*r,d=nd(e);return`<svg width="${z}" height="${z}"><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="6"/><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="${urg(d)}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*prog(e)} ${c}" transform="rotate(-90 ${z/2} ${z/2})"/><text x="50%" y="54%" text-anchor="middle" font-size="${z/5}" fill="var(--fg)">${Math.round(prog(e)*100)}%</text></svg>`}
const sy=e=>{let a=0,b=0;(e.sub||[]).forEach(s=>s.t.forEach(t=>{a++;if(t.dn)b++}));return[b,a]};
const mins=k=>S.log.filter(l=>l.d==k).reduce((a,l)=>a+l.m,0);
function streak(){let n=0,d=new Date();if(!mins(dk(d)))d=new Date(d-864e5);while(mins(dk(d))>0){n++;d=new Date(d-864e5)}return n}
const totalH=()=>S.log.reduce((a,l)=>a+l.m,0)/60;
function card(e,hero){const d=nd(e),ms=L(e),v=hero?'card':S.s.v,s=sy(e),nx=(e.ms||[]).filter(m=>new Date(m.d)>Date.now()).sort((a,b)=>a.d>b.d?1:-1)[0];
if(v=='compact'&&!hero)return`<div class="card row" style="border-left:5px solid ${e.color};padding:8px 12px"><span>${e.emoji}</span><b class="sp">${E(e.name)}</b><span class="cd" data-c="${e.id}">${cdH(e)}</span><button class="g" data-a="edit" data-i="${e.id}">✏️</button></div>`;
return`<div class="card ${hero?'hero':''}" style="border-color:${hero?e.color:'var(--bd)'};${hero?'':'border-left:5px solid '+e.color}"><div class="row"><span style="font-size:${hero?34:24}px">${e.emoji}</span><div class="sp" style="text-align:left"><h3 style="margin:0">${E(e.name)}${e.attempt>1?' <span class="chip">attempt '+e.attempt+'</span>':''}</h3><div class="mut">${fD(tg(e))}, ${fT(tg(e))} · ${E(e.cat)}</div></div>${ring(e,hero?72:52)}</div>
<div class="cd" data-c="${e.id}" style="margin:8px 0">${cdH(e)}</div>
${v=='list'&&!hero?'':`<div class="mut">${ms>0?`≈ ${(d/7).toFixed(1)} weeks · ${(d/30.4).toFixed(1)} months · ${wd(e)} working days · ${we(e)} weekend days`:''}</div>${s[1]?`<div class="bar" style="margin:8px 0"><i style="width:${s[0]/s[1]*100}%"></i></div><div class="mut">Syllabus ${s[0]}/${s[1]} (${Math.round(s[0]/s[1]*100)}%)</div>`:''}${nx?`<div class="mut">Next: ${E(nx.n)} in ${Math.ceil((new Date(nx.d)-Date.now())/864e5)}d</div>`:''}${e.venue?`<div class="mut">📍 ${E(e.venue)}</div>`:''}${e.link&&/^https?:/.test(e.link)?`<div><a href="${E(e.link)}" target="_blank" rel="noopener">Official link ↗</a></div>`:''}${e.notes?`<div class="mut">📝 ${E(e.notes)}</div>`:''}`}
<div class="row noprint" style="margin-top:8px;justify-content:${hero?'center':'flex-start'}"><button class="g" data-a="pin" data-i="${e.id}">${S.pin==e.id?'📌 Pinned':'📍 Pin'}</button><button class="g" data-a="focus" data-i="${e.id}">🔍 Focus</button><button class="g" data-a="copy" data-i="${e.id}">📋 Copy</button><button class="g" data-a="plan" data-i="${e.id}">🗂️ Plan</button><button class="g" data-a="edit" data-i="${e.id}">✏️</button><button class="g" data-a="del" data-i="${e.id}">🗑️</button></div></div>`}
function exSel(){return S.ex.length?`<select data-a="sel">${S.ex.map(e=>`<option value="${e.id}" ${cur().id==e.id?'selected':''}>${e.emoji} ${E(e.name)}</option>`).join('')}</select>`:''}
const empty='<div class="card mut">Add an exam on the Home tab first.</div>';
const V={
home(){let l=S.ex.filter(e=>(cat=='archived')==!!isArch(e)&&(cat=='all'||cat=='archived'||e.cat==cat)&&e.name.toLowerCase().includes(q.toLowerCase()));
l.sort((a,b)=>srt=='name'?a.name.localeCompare(b.name):srt=='prog'?prog(b)-prog(a):tg(a)-tg(b));
const hero=ex(S.pin)||S.ex.filter(e=>L(e)>0).sort((a,b)=>tg(a)-tg(b))[0],cs=[...new Set(S.ex.map(e=>e.cat))];
return`${S.seen?'':'<div class="card">👋 <b>Welcome!</b> Tap <b>＋ New</b> or <b>Presets</b> to add exams. Pin one as your hero countdown. Shortcuts: n new · / search · f focus · t theme. Data stays on this device.<br><button data-a="seen">Got it</button></div>'}
<div class="row noprint"><input id="q" placeholder="Search (/)" value="${E(q)}" class="sp"><select data-a="cat"><option value="all">All</option>${cs.map(c=>`<option ${cat==c?'selected':''}>${E(c)}</option>`).join('')}<option value="archived" ${cat=='archived'?'selected':''}>Archived</option></select><select data-a="srt"><option value="date">Soonest</option><option value="name" ${srt=='name'?'selected':''}>Name</option><option value="prog" ${srt=='prog'?'selected':''}>Progress</option></select><select data-a="view">${['card','list','compact'].map(v=>`<option ${S.s.v==v?'selected':''}>${v}</option>`).join('')}</select><button class="p" data-a="new">＋ New</button><button data-a="pre">Presets</button></div>
${hero?'<div style="height:10px"></div>'+card(hero,1):''}<div class="mut">${E(QT[new Date().getDate()%QT.length])}</div>
<h2>Exams (${l.length})</h2><div class="grid">${l.map(e=>card(e)).join('')||'<div class="mut">Nothing here yet.</div>'}</div>${undo?'<div class="card row"><span class="sp">Exam deleted.</span><button class="p" data-a="undo">Undo</button></div>':''}`},
plan(){const e=cur();if(!e)return empty;const s=sy(e),hp=+e.hpt||4,need=(s[1]-s[0])*hp,days=Math.max(wd(e),1),rd=[];
const today=Date.now();(e.sub||[]).forEach(u=>u.t.forEach(t=>{if(t.dn&&t.dd){const a=Math.floor((today-t.dd)/864e5);[1,3,7,21].includes(a)&&rd.push(u.n+': '+t.n+' (day '+a+')')}}));
const wk=[];(e.sub||[]).forEach(u=>u.t.forEach(t=>t.wk&&wk.push(u.n+': '+t.n)));
return`<div class="row">${exSel()}<span class="sp"></span><button data-a="addsub">＋ Subject</button><select data-a="tpl"><option value="">Template…</option>${Object.keys(TPL).map(k=>`<option>${k}</option>`).join('')}</select></div>
<div class="card"><h3>⏱️ Hours planner</h3><div>${s[1]-s[0]} topics left × ${hp}h = <b>${need}h</b> needed</div><div>${days} study days left (rest days excluded) → <b style="font-size:22px;color:${need/days>8?'#ef4444':'inherit'}">${(need/days).toFixed(1)} h/day</b></div><div class="mut">Hours per topic: <input type="number" min="1" style="width:70px" value="${hp}" data-a="hpt"></div></div>
<div class="card"><h3>🔁 Revisions due today (1-3-7-21)</h3>${rd.map(x=>`<div>• ${E(x)}</div>`).join('')||'<span class="mut">None due.</span>'}</div>
<div class="card"><h3>⚠️ Weak topics</h3>${wk.map(x=>`<div>• ${E(x)}</div>`).join('')||'<span class="mut">Flag topics with ⚑.</span>'}</div>
<div class="card"><h3>🗓️ Milestones</h3>${(e.ms||[]).map((m,i)=>{const d=Math.ceil((new Date(m.d)-Date.now())/864e5);return`<div class="row"><span class="sp">${E(m.n)} · ${m.d.replace('T',' ')}</span><span class="chip">${d>=0?d+'d':'past'}</span><button class="g" data-a="delms" data-i="${i}">✕</button></div>`}).join('')}<button data-a="addms">＋ Milestone</button> <span class="mut">registration, admit card, result…</span></div>
${(e.sub||[]).map((u,i)=>{const a=u.t.filter(t=>t.dn).length;return`<div class="card"><div class="row"><h3 class="sp">${E(u.n)} <span class="mut">${a}/${u.t.length}${u.w?' · '+u.w+'% weight':''}</span></h3><button class="g" data-a="addt" data-i="${i}">＋</button><button class="g" data-a="wt" data-i="${i}">%</button><button class="g" data-a="delsub" data-i="${i}">🗑️</button></div><div class="bar"><i style="width:${u.t.length?a/u.t.length*100:0}%"></i></div>${u.t.map((t,j)=>`<div class="row todo ${t.dn?'d':''}"><input type="checkbox" ${t.dn?'checked':''} data-a="tt" data-i="${i}" data-j="${j}"><span class="sp">${E(t.n)}</span><button class="g" data-a="wk" data-i="${i}" data-j="${j}" style="opacity:${t.wk?1:.3}">⚑</button><button class="g" data-a="dt" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}</div>`}).join('')}`},
study(){const e=cur(),t=dk(new Date()),days=[...Array(84)].map((_,i)=>dk(new Date(Date.now()-(83-i)*864e5))),mx=Math.max(60,...days.map(mins)),wkd=[...Array(7)].map((_,i)=>dk(new Date(Date.now()-(6-i)*864e5))),wm=wkd.map(mins),wmx=Math.max(60,...wm),ws=wm.reduce((a,b)=>a+b,0),bs={};S.log.forEach(l=>bs[l.s]=(bs[l.s]||0)+l.m);
return`<div class="card" style="text-align:center"><h3>🍅 Pomodoro</h3><div class="big" id="pt">${p(Math.floor(pm.rem/60))}:${p(pm.rem%60)}</div><div class="mut">${pm.mode=='w'?'Focus':'Break'}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="p" data-a="pgo">${pm.run?'Pause':'Start'}</button><button data-a="prs">Reset</button>${e?`<select data-a="psub"><option value="">General</option>${(e.sub||[]).map(u=>`<option ${pm.sub==u.n?'selected':''}>${E(u.n)}</option>`).join('')}</select>`:''}</div></div>
<div class="card"><div class="row"><h3 class="sp">📊 Today &amp; goals</h3><button data-a="addlog">＋ Log time</button></div><div>🔥 Streak: <b>${streak()}</b> days · Total <b>${totalH().toFixed(1)}h</b></div>
<div class="mut">Today ${(mins(t)/60).toFixed(1)}h / ${S.gd}h</div><div class="bar"><i style="width:${Math.min(100,mins(t)/60/S.gd*100)}%"></i></div><div class="mut" style="margin-top:6px">Week ${(ws/60).toFixed(1)}h / ${S.gw}h</div><div class="bar"><i style="width:${Math.min(100,ws/60/S.gw*100)}%"></i></div>
<div class="row mut" style="margin-top:8px">Daily <input type="number" step=".5" style="width:70px" value="${S.gd}" data-a="gd"> Weekly <input type="number" style="width:70px" value="${S.gw}" data-a="gw"></div></div>
<div class="card"><h3>Last 12 weeks</h3><div class="heat">${days.map(d=>`<i title="${d}: ${mins(d)}m" style="background:color-mix(in srgb,var(--ac) ${Math.round(mins(d)/mx*100)}%,var(--bd))"></i>`).join('')}</div></div>
<div class="card"><h3>This week</h3><svg viewBox="0 0 210 80" width="100%">${wm.map((m,i)=>`<rect x="${i*30+4}" y="${70-m/wmx*60}" width="22" height="${m/wmx*60}" rx="4" fill="var(--ac)"/><text x="${i*30+15}" y="79" font-size="8" text-anchor="middle" fill="var(--mut)">${wkd[i].slice(8)}</text>`).join('')}</svg>
<h3>By subject</h3>${Object.entries(bs).map(([k,v])=>`<div class="row"><span style="width:110px">${E(k)}</span><div class="bar sp"><i style="width:${v/Math.max(...Object.values(bs))*100}%"></i></div><span class="mut">${(v/60).toFixed(1)}h</span></div>`).join('')||'<span class="mut">No logs yet.</span>'}</div>
<div class="card"><h3>✅ To-do</h3>${S.td.map((x,i)=>`<div class="row todo ${x.d?'d':''}"><input type="checkbox" ${x.d?'checked':''} data-a="td" data-i="${i}"><span class="sp">${E(x.t)}</span><button class="g" data-a="dtd" data-i="${i}">✕</button></div>`).join('')}<div class="row"><input id="ntd" class="sp" placeholder="Today’s goal…"><button data-a="atd">Add</button></div></div>

<div class="card"><h3>🏅 Badges</h3>${badges()}</div>`},

cal(){const y=mo.getFullYear(),m=mo.getMonth(),f=new Date(y,m,1),off=(f.getDay()-S.s.wk+7)%7,n=new Date(y,m+1,0).getDate(),wn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let c=wn.map((_,i)=>`<div class="h">${wn[(i+S.s.wk)%7]}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(off);
for(let d=1;d<=n;d++){const k=y+'-'+p(m+1)+'-'+p(d),es=S.ex.filter(e=>e.date.startsWith(k)),ms=[];S.ex.forEach(e=>(e.ms||[]).forEach(x=>x.d.startsWith(k)&&ms.push(x.n)));c+=`<div class="${k==dk(new Date())?'t':''}">${d}${es.map(e=>`<div style="all:unset;display:block;color:${e.color};font-weight:700">${e.emoji}</div>`).join('')}${ms.map(x=>`<div style="all:unset;display:block;font-size:10px">◆ ${E(x).slice(0,8)}</div>`).join('')}${mins(k)?`<div style="all:unset;display:block;font-size:10px;color:var(--mut)">${(mins(k)/60).toFixed(1)}h</div>`:''}</div>`}

function render(){const T={home:'🏠 Home',plan:'🗂️ Plan',study:'⏱️ Study',mocks:'📝 Mocks',cal:'📅 Cal',set:'⚙️ More'},r=document.documentElement;S.s.th=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.s.th);r.style.setProperty('--ac',S.s.ac);

function modal(h){$('#ov').innerHTML=`<div class="modal"><div>${h}</div></div>`}const close=()=>{$('#ov').innerHTML=''};
function form(t,f,cb){modal(`<h3>${t}</h3>${f.map(x=>`<label>${x.l}</label>${x.t=='area'?`<textarea name="${x.k}">${E(x.v)}</textarea>`:x.t=='sel'?`<select name="${x.k}">${x.o.map(o=>`<option ${o==x.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${E(x.v)}">`}`).join('')}<div class="row" style="margin-top:12px"><button class="p" id="ok">Save</button><button data-a="x">Cancel</button></div>`);

function out(t,txt){modal(`<h3>${t}</h3><textarea id="ot" style="min-height:160px" readonly>${E(txt)}</textarea><div class="row" style="margin-top:10px"><button class="p" id="cp">Copy</button><button data-a="x">Close</button></div>`);$('#cp').onclick=()=>{try{navigator.clipboard.writeText(txt)}catch(e){$('#ot').select();document.execCommand('copy')}$('#cp').textContent='Copied ✓'}}
function toast(t){out('Copy this',t)}
const nowL=()=>{const d=new Date(Date.now()+864e5*30);return dk(d)+'T09:00'};
function exForm(e,pre){const n=e||pre||{name:'',date:nowL(),emoji:'🎯',color:'#6366f1',cat:'Other',venue:'',link:'',attempt:1,notes:'',hpt:4};form(e?'Edit exam':'New exam',[{k:'name',l:'Name',v:n.name},{k:'date',l:'Date &amp; time',t:'datetime-local',v:n.date},{k:'emoji',l:'Emoji',v:n.emoji},{k:'color',l:'Color',t:'color',v:n.color},{k:'cat',l:'Category',t:'sel',o:['ESE','GATE','JEE','NEET','UPSC','SSC','Bank','MBA','Other'],v:n.cat},{k:'venue',l:'Venue',v:n.venue},{k:'link',l:'Link (https://…)',v:n.link},{k:'attempt',l:'Attempt #',t:'number',v:n.attempt},{k:'notes',l:'Notes',t:'area',v:n.notes}],o=>{if(!o.name||!o.date)return;if(e)Object.assign(e,o);else{const x=Object.assign({id:uid(),start:Date.now(),sub:[],ms:[],mocks:[],hpt:4},o);S.ex.push(x);sel=x.id}})}
function addTpl(e,k){TPL[k].split(';').forEach(z=>{const[a,b]=z.split(':');e.sub.push({n:a,w:0,t:b.split(',').map(n=>({n,dn:0}))})})}
function conf(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let P=[...Array(120)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12,c:`hsl(${Math.random()*360},90%,60%)`})),f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;x.fillStyle=q.c;x.fillRect(q.x,q.y,6,9)});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),600)}catch(e){}}

const A={tab(_,el){tab=el.dataset.i;render()},x:close,seen(){S.seen=1;save();render()},new(){exForm()},edit(i){exForm(ex(i))},
del(i){const e=ex(i);undo=e;S.ex=S.ex.filter(x=>x!=e);if(S.pin==i)S.pin=null;save();render();setTimeout(()=>{undo=null;tab=='home'&&render()},8e3)},undo(){S.ex.push(undo);undo=null;save();render()},

pgo(){if(pm.run){pm.run=0}else{pm.run=1;pm.end=Date.now()+pm.rem*1e3}render()},prs(){pm={run:0,mode:'w',end:0,rem:S.s.pw*60,sub:pm.sub};render()},psub(_,el){pm.sub=el.value},

rest(i,el){const r=S.s.rest,n=+el.dataset.i;S.s.rest=el.checked?[...r,n]:r.filter(x=>x!=n);save()},pw(_,el){S.s.pw=+el.value||25;pm.rem=S.s.pw*60;save()},pb(_,el){S.s.pb=+el.value||5;save()},
notif(){try{Notification.requestPermission().then(r=>toast('Notifications: '+r))}catch(e){toast('Not supported here.')}},ics(){out('Paste into a .ics file',ics())},exp(){out('Backup JSON (copy &amp; save)',JSON.stringify(S))},

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='SELECT'||(el.tagName=='INPUT'&&el.type!='checkbox'&&el.type!='button')||el.tagName=='TEXTAREA')return;if(el.classList.contains('focus')&&e.target.closest('button'))return;A[el.dataset.a]&&A[el.dataset.a](el.dataset.i,el)});

const h=ex(S.pin)||S.ex.filter(e=>L(e)>0).sort((a,b)=>tg(a)-tg(b))[0];document.title=h?(Math.max(nd(h),0)+'d to '+h.name):'Exam Countdown';
if(++tk%60==0){if(!$('#ov').innerHTML)render();if('Notification' in window&&Notification.permission=='granted')S.ex.forEach(e=>{const d=nd(e);[100,50,30,7,1].forEach(t=>{const k=e.id+':'+t;if(d==t&&!S.nf[k]){S.nf[k]=1;save();try{new Notification(e.name,{body:t+' day(s) to go'})}catch(x){}}})})}
S.ex.forEach(e=>{const m=L(e),k='c'+e.id+dk(new Date());if(m<=0&&m>-864e5&&!S.nf[k]){S.nf[k]=1;save();conf()}})},1e3);
